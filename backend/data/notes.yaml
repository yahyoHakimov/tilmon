# --- XVI bo'lim: 84/85-boblar ----------------------------------------------

N_84_85_farq:
  ref: "84-bobga izoh, 1-band / 85-bob sarlavhasi — tasnif izohi"
  status: unverified
  text: >-
    84-bob asosan mexanik ishlash prinsipiga asoslangan mashina va
    qurilmalarni, 85-bob esa elektr mashinalari, elektrotexnika jihozlari va
    ularning qismlarini qamraydi. Qurilma ikkala bobga tegishli bo'lishi mumkin
    bo'lganda, uning asosiy vazifasi hal qiluvchi hisoblanadi.

N_8471_sarlavha:
  ref: "8471 pozitsiyasi sarlavhasi"
  status: unverified
  text: >-
    Hisoblash mashinalari va ularning bloklari; magnit yoki optik o'qish
    qurilmalari, ma'lumotlarni kodlangan shaklda ma'lumot tashuvchilarga
    ko'chirish mashinalari va bunday ma'lumotlarni qayta ishlash mashinalari.

N_8471_izoh_portativ:
  ref: "8471 30 subpozitsiyasi izohi"
  status: unverified
  text: >-
    8471 30 subpozitsiyasiga massasi 10 kg dan oshmaydigan portativ raqamli
    hisoblash mashinalari kiradi, ular hech bo'lmaganda markaziy protsessor,
    klaviatura va displeyni o'z ichiga oladi.

N_8517_sarlavha:
  ref: "8517 pozitsiyasi sarlavhasi"
  status: unverified
  text: >-
    Telefon apparatlari, uyali aloqa tarmoqlari yoki boshqa simsiz aloqa
    tarmoqlari uchun telefonlarni ham qo'shgan holda; ovoz, tasvir yoki boshqa
    ma'lumotlarni uzatish yoki qabul qilish uchun boshqa apparatura.

N_8517_smartfon:
  ref: "8517 13 subpozitsiyasi izohi"
  status: unverified
  text: >-
    Smartfonlar — uyali aloqa tarmoqlari uchun mo'ljallangan, aloqa
    vazifasidan tashqari ilovalarni bajaruvchi operatsion tizim bilan
    jihozlangan telefonlar.

N_8504_sarlavha:
  ref: "8504 pozitsiyasi sarlavhasi"
  status: unverified
  text: >-
    Elektr transformatorlari, statik o'zgartirgichlar (masalan, to'g'rilagichlar)
    va induktivlik g'altaklari.

N_8504_adapter:
  ref: "8504 40 subpozitsiyasi izohi"
  status: unverified
  text: >-
    Zaryadlash qurilmalari va quvvat adapterlari statik o'zgartirgichlar
    sifatida 8504 40 subpozitsiyasiga kiradi, garchi ular telefon yoki
    kompyuter bilan birga ishlatilsa ham. Ular tegishli qurilmaning qismi
    sifatida tasniflanmaydi.

N_8544_sarlavha:
  ref: "8544 pozitsiyasi sarlavhasi"
  status: unverified
  text: >-
    Izolyatsiyalangan simlar, kabellar va boshqa izolyatsiyalangan elektr
    o'tkazgichlar, konnektorlar bilan yoki ularsiz.
