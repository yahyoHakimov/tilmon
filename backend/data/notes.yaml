# --- Bo'lim darajasi --------------------------------------------------------

N_XI_bolim:
  ref: "XI bo'lim (50–63-boblar) sarlavhasi"
  status: unverified
  text: >-
    To'qimachilik materiallari va ulardan tayyorlangan buyumlar.

N_XI_izoh_2:
  ref: "XI bo'limga izoh, 2(A)-band"
  status: unverified
  text: >-
    Ikki yoki undan ortiq to'qimachilik materialidan iborat buyumlar massa
    bo'yicha ustun turadigan material bo'yicha tasniflanadi. Ustunlik uchun
    material qolgan materiallarning har biridan ko'proq bo'lishi yetarli.

N_XVI_bolim:
  ref: "XVI bo'lim (84–85-boblar) sarlavhasi"
  status: unverified
  text: >-
    Mashinalar, uskunalar va mexanizmlar; elektrotexnika jihozlari; ularning
    qismlari; ovoz yozish va qayta ijro etish apparaturasi, televizion tasvir
    va ovozni yozish va qayta ijro etish apparaturasi, ularning qismlari va
    aksessuarlari.

# --- 60/61/62-boblar: trikotaj va to'qima ----------------------------------

N_60_trikotaj_tarif:
  ref: "60-bob (trikotaj matolar) — tasnif izohi"
  status: unverified
  text: >-
    Trikotaj mato ipning bir yoki bir nechta halqalar tizimiga birlashtirilishi
    natijasida hosil qilinadi. To'qima mato esa bir-biriga perpendikulyar
    joylashgan ikki tizim — asos va arqoq iplarining kesishuvidan hosil bo'ladi.

N_61_sarlavha:
  ref: "61-bob sarlavhasi"
  status: unverified
  text: >-
    Trikotaj kiyim va kiyim aksessuarlari.

N_61_izoh_1:
  ref: "61-bobga izoh, 1-band"
  status: unverified
  source_hint: >-
    GS 61-bobga 1-izoh. Ruscha tahriri: "В данную группу включаются только
    готовые трикотажные изделия машинного или ручного вязания."
    Tekshirish: lex.uz ПП-181 (14.05.2025) ilovalari, o'zbek tilida.
  text: >-
    Ushbu bobga faqat mashinada yoki qo'lda to'qilgan tayyor trikotaj
    buyumlar kiradi.

N_62_sarlavha:
  ref: "62-bob sarlavhasi"
  status: unverified
  text: >-
    Kiyim va kiyim aksessuarlari, trikotajdan tashqari.

N_62_izoh_1:
  ref: "62-bobga izoh, 1-band"
  status: unverified
  source_hint: >-
    GS 62-bobga 1-izoh. Ruscha tahriri: "В данную группу включаются предметы
    одежды мужской, женской или детской, принадлежности к одежде и части
    одежды или принадлежностей к одежде, изготовленные из материалов
    (исключая вату, но включая войлок или фетр или нетканые материалы)
    групп 50–56, 58 и 59."
    Tekshirish: lex.uz ПП-181 (14.05.2025) ilovalari, o'zbek tilida.
  text: >-
    Ushbu bobga 50–56, 58 va 59-boblardagi materiallardan (paxta momig'idan
    tashqari, lekin kigiz va to'qilmagan materiallarni qo'shgan holda)
    tayyorlangan erkaklar, ayollar yoki bolalar kiyimi, kiyim aksessuarlari
    va ularning qismlari kiradi.

N_61_62_izoh_jins:
  ref: "61-bobga izoh, 9-band / 62-bobga izoh, 8-band"
  status: unverified
  text: >-
    Old qismi chapdan o'ngga yopiladigan kiyimlar erkaklar yoki o'g'il bolalar
    kiyimi sifatida, o'ngdan chapga yopiladiganlari esa ayollar yoki qizlar
    kiyimi sifatida tasniflanadi. Kiyim qaysi jins uchun mo'ljallanganini
    aniqlab bo'lmasa, u ayollar yoki qizlar kiyimi sifatida tasniflanadi.

