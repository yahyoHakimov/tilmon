# Farqlovchilar — daraxtning har bir tarmoqlanish nuqtasidagi savol.
#
# Agar farqlovchining atributi noma'lum bo'lsa, dvigatel SHU YERDA to'xtaydi
# va kod bermaydi. Bu tizimning asosiy xavfsizlik mexanizmi.
#
# `basis` — notes.yaml dagi izoh id lari. Asossiz farqlovchi bo'lishi mumkin
# emas: test buni tekshiradi.

# ═══ Ildiz ═══════════════════════════════════════════════════════════════
- id: D_kategoriya
  at_node: ROOT
  attribute: mahsulot_kategoriyasi
  why_uz: "Bo'limni tanlaydi — undan keyingi barcha savollar shunga bog'liq."
  branches:
    kiyim: "XI"
    uskuna: "XVI"
  basis: [N_XI_bolim, N_XVI_bolim]

# ═══ To'qimachilik: eng muhim farqlovchi ═════════════════════════════════
- id: D_mato
  at_node: "XI"
  attribute: mato_turi
  why_uz: >-
    61-bob va 62-bob o'rtasidagi yagona farq. Ko'rinishi bir xil kiyim,
    lekin boj stavkasi va jarima boshqa. Yetkazib beruvchi ko'rsatmasa,
    aniqlash shart — taxmin qilib bo'lmaydi.
  branches:
    trikotaj: "61"
    toqima: "62"
  basis: [N_60_trikotaj_tarif, N_61_sarlavha, N_62_sarlavha]

# ═══ Kiyim turi ══════════════════════════════════════════════════════════
- id: D_61_tur
  at_node: "61"
  attribute: mahsulot_turi
  why_uz: "61-bob ichida pozitsiyani tanlaydi."
  branches:
    koylak_bluzka: "61.KB"
    futbolka: "6109"
    sviter: "6110"
    shim: "61.SH"
  basis: [N_61_sarlavha, N_6109_sarlavha, N_6110_sarlavha]

- id: D_62_tur
  at_node: "62"
  attribute: mahsulot_turi
  why_uz: >-
    62-bob ichida pozitsiyani tanlaydi. Diqqat: futbolka va sviter
    ta'rifi bo'yicha trikotaj buyumlar — ular 62-bobda uchramaydi.
  branches:
    koylak_bluzka: "62.KB"
    shim: "62.SH"
  basis: [N_62_sarlavha, N_6206_sarlavha, N_6204_sarlavha]

