# Tasnif uchun kerakli xususiyatlar.
#
# `values` — YOPIQ ro'yxat. Ekstraktor (4-bosqich) faqat shu qiymatlardan
# birini qaytara oladi. Boshqa har qanday narsa `None` ga aylanadi va tizim
# jim turadi. Bu tasodifiy emas: ochiq matn qiymati = nazoratsiz tasnif.
#
# `question_uz` — atribut noma'lum bo'lganda foydalanuvchiga beriladigan savol.

mahsulot_kategoriyasi:
  label_uz: "Mahsulot toifasi"
  question_uz: "Bu qanday mahsulot — kiyim-kechakmi yoki elektr/mexanik uskunami?"
  hint_uz: "MVP hozircha faqat shu ikki yo'nalishni qamraydi."
  values:
    - kiyim
    - uskuna
  value_labels:
    kiyim: "Kiyim-kechak"
    uskuna: "Elektr yoki mexanik uskuna"

mato_turi:
  label_uz: "Matoning ishlab chiqarilish usuli"
  question_uz: >-
    Mato trikotajmi yoki to'qimami? Trikotaj — ipning halqalaridan hosil
    qilingan, cho'ziluvchan (futbolka, sviter mato). To'qima — tayyor
    matodan tikilgan, cho'zilmaydi (klassik ko'ylak mato).
  hint_uz: >-
    Yetkazib beruvchidan so'rang yoki matoni cho'zib ko'ring. Bu 61-bob va
    62-bob o'rtasidagi yagona farq va boj stavkasini belgilaydi.
  values:
    - trikotaj
    - toqima
  value_labels:
    trikotaj: "Trikotaj — ip halqalaridan to'qilgan, cho'ziluvchan"
    toqima: "To'qima — tayyor matodan tikilgan, cho'zilmaydi"

mahsulot_turi:
  label_uz: "Kiyim turi"
  question_uz: "Bu qanday kiyim — ko'ylak/bluzka, futbolka, sviter/jemper yoki shim?"
  values:
    - koylak_bluzka
    - futbolka
    - sviter
    - shim
  value_labels:
    koylak_bluzka: "Ko'ylak yoki bluzka"
    futbolka: "Futbolka, mayka"
    sviter: "Sviter, jemper, kardigan"
    shim: "Shim yoki shorti"

jins:
  label_uz: "Kim uchun mo'ljallangan"
  question_uz: "Kiyim erkaklar/o'g'il bolalar uchunmi yoki ayollar/qizlar uchun?"
  hint_uz: >-
    Aniq bo'lmasa, tugmalar yo'nalishiga qarang: old qismida chapdan o'ngga
    yopilsa — erkaklar kiyimi.
  values:
    - erkak
    - ayol
  value_labels:
    erkak: "Erkaklar yoki o'g'il bolalar uchun"
    ayol: "Ayollar yoki qizlar uchun"

tarkib:
  label_uz: "Massa bo'yicha ustun material"
  question_uz: >-
    Massa bo'yicha qaysi material ustun — paxta, kimyoviy tola
    (poliester, viskoza, akril), jun yoki ipak?
  hint_uz: >-
    Aralash matoda ustun material 50% dan ko'p bo'lishi shart emas —
    qolganlarining har biridan ko'p bo'lsa yetarli.
  values:
    - paxta
    - kimyoviy_tola
    - jun
    - ipak
  value_labels:
    paxta: "Paxta"
    kimyoviy_tola: "Kimyoviy tola (poliester, viskoza, akril)"
    jun: "Jun"
    ipak: "Ipak"

uskuna_turi:
  label_uz: "Uskuna turi"
  question_uz: "Bu qanday qurilma — telefon, kompyuter, quvvat manbai/adapter yoki kabel?"
  values:
    - telefon
    - kompyuter
    - quvvat_manbai
    - kabel
  value_labels:
    telefon: "Telefon apparati"
    kompyuter: "Kompyuter yoki noutbuk"
    quvvat_manbai: "Quvvat manbai, adapter, zaryadlovchi"
    kabel: "Kabel yoki sim"

telefon_turi:
  label_uz: "Telefon turi"
  question_uz: "Bu smartfonmi, oddiy uyali telefonmi yoki simli telefonmi?"
  values:
    - smartfon
    - boshqa_uyali
    - simli
  value_labels:
    smartfon: "Smartfon (operatsion tizim bilan)"
    boshqa_uyali: "Oddiy uyali telefon"
    simli: "Simli statsionar telefon"

kompyuter_turi:
  label_uz: "Kompyuter turi"
  question_uz: "Bu portativ (noutbuk, planshet, massasi 10 kg dan kam) yoki statsionarmi?"
  hint_uz: "10 kg chegarasi qonuniy — massani aniq bilish kerak."
  values:
    - portativ
    - statsionar
  value_labels:
    portativ: "Portativ — noutbuk, planshet, 10 kg gacha"
    statsionar: "Statsionar — sistema bloki, server"

quvvat_turi:
  label_uz: "Quvvat qurilmasi turi"
  question_uz: "Bu statik o'zgartirgichmi (adapter, zaryadlovchi) yoki transformatormi?"
  values:
    - adapter
    - transformator
  value_labels:
    adapter: "Statik o'zgartirgich — adapter, zaryadlovchi"
    transformator: "Transformator"

kabel_turi:
  label_uz: "Kabel turi"
  question_uz: "Kabel konnektor (uchlik, razyom) bilan jihozlanganmi yoki yo'q?"
  values:
    - konnektorli
    - konnektorsiz
  value_labels:
    konnektorli: "Konnektor (razyom, uchlik) bilan"
    konnektorsiz: "Konnektorsiz — g'altakdagi sim"
