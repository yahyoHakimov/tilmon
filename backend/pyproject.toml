[project]
name = "tilmon-backend"
version = "0.1.0"
description = "TN VED tasniflash tizimi — asoslangan tasnif, bilmaganda jim turadi"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.9",
    "pyyaml>=6.0",
    "openai>=1.54",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Odatiy yugurishda `live` testlar o'tkazib yuboriladi: CI barqaror
# bo'lishi va tekin ishlashi uchun. Ularni ochiq chaqirish kerak:
#   uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: OpenAI API kaliti talab qiladi (uv run pytest -m live)",
    "db: Postgres talab qiladi; baza yo'q bo'lsa o'tkazib yuboriladi",
]
