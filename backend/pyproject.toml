[project]
name = "tilmon-backend"
version = "0.1.0"
description = "TN VED tasniflash tizimi — asoslangan tasnif, bilmaganda jim turadi"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: OpenAI API kaliti talab qiladi (uv run pytest -m live)",
]
