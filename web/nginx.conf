# Konteyner ichidagi nginx — faqat SPA static fayllarini beradi.
# /api so'rovlarini gateway nginx (swiftshield-nginx-1) backend'ga uzatadi,
# shu sabab bu yerda /api yo'q.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /login, /register kabi yo'llar ham index.html'ga tushadi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'langan assetlarni uzoq keshlaymiz.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
